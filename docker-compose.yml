# Run the whole app locally with one command:
#   docker compose up --build
# Web app: http://localhost:8080  (the API is reached through it at /api)
#
# Needs a .env file in the project root with SUPABASE_URL and SUPABASE_KEY
# (the publishable key). Port 8080 busy? Add WEB_PORT=3080 (any free port) to .env.
services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      args:
        # the browser signs in with Supabase directly, using the same
        # project URL and publishable key as the API
        VITE_SUPABASE_URL: ${SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_KEY}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
