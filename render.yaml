# Render Blueprint for the API (Render dashboard -> Blueprints -> New Blueprint Instance).
# Secrets use sync: false, so Render asks for them in the dashboard; they never live in git.
services:
  - type: web
    name: gympulse-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SUPABASE_URL              # from your Supabase project: Settings -> API
        sync: false
      - key: SUPABASE_KEY              # the anon / publishable key
        sync: false
      - key: ALLOWED_ORIGINS           # your Vercel URL, e.g. https://gympulse.vercel.app
        sync: false
