# Render Blueprint for the API (Render dashboard -> Blueprints -> New Blueprint Instance).
# Secrets use sync: false, so Render asks for them in the dashboard; they never live in git.
services:
  - type: web
    name: gympulse-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    # main.py is a standalone module; --app-dir puts backend/app on the import path
    startCommand: uvicorn main:app --app-dir backend/app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SUPABASE_URL              # Supabase: Settings -> API
        sync: false
      - key: SUPABASE_KEY              # the publishable (anon) key, never service_role
        sync: false
