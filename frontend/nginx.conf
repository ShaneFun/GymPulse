server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same contract as the Vite dev proxy: /api/... goes to the API with the
    # /api prefix stripped. The upstream is resolved per request (Docker's DNS),
    # so nginx still starts if the API container isn't up yet.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built assets have hashed names, so they can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
